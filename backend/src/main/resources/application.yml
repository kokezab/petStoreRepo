spring:
  application:
    name: zerocode-backend
  datasource:
    url: jdbc:postgresql://localhost:5434/zerocode
    username: zerocode
    password: zerocode
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8090
  # Item lists are JSON-heavy; gzip shrinks them several-fold over the wire.
  compression:
    enabled: true
    mime-types: application/json

---
# Demo profile: also loads db/seed so Swagger has sample data.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed
